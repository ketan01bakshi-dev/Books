<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Books — Knowledge Graphs</title>
<style>
  :root {
    --bg: #14171c; --panel: #1c2028; --border: #2a2f3a;
    --text: #e8eaed; --muted: #9aa3b0; --accent: #5fa8ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); padding: 32px 16px 64px;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 28px; margin-bottom: 4px; }
  .sub { color: var(--muted); margin-bottom: 40px; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 40px 0 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  a.card {
    display: block; background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px; text-decoration: none; color: var(--text); transition: border-color 0.15s;
  }
  a.card:hover { border-color: var(--accent); }
  a.card .title { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
  a.card .author { color: var(--muted); font-size: 13px; }
  a.card .links { margin-top: 10px; display: flex; gap: 10px; }
  a.card .links span { font-size: 12px; color: var(--accent); }
  a.master { border-color: #e0c46c; }
  a.master .title { color: #e0c46c; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Books — Knowledge Graphs</h1>
  <p class="sub">Explorable concept maps, organized by subject and synthesized across books.</p>

  <h2>Subjects</h2>
  <div class="grid" id="subjects"></div>

  <h2>Master of All</h2>
  <div class="grid">
    <a class="card master" href="viewer.html?graph=subjects/master/master.json&base=.">
      <div class="title">🌐 Everything, synthesized</div>
      <div class="author">Cross-subject vocabulary, questions & conflicts across every book</div>
    </a>
  </div>

  <h2>Books</h2>
  <div class="grid" id="books"></div>
</div>

<script>
async function main() {
  const res = await fetch('subjects.json');
  const data = await res.json();

  const subjectsEl = document.getElementById('subjects');
  data.subjects.forEach((s) => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = `viewer.html?graph=subjects/${s.id}/master.json&base=.`;
    a.innerHTML = `<div class="title">${s.label}</div><div class="author">${s.description}</div>
      <div class="links"><span>${s.bookIds.length} book(s)</span></div>`;
    subjectsEl.appendChild(a);
  });

  const booksEl = document.getElementById('books');
  Object.entries(data.books).forEach(([id, meta]) => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = `viewer.html?graph=books/${id}/graph.json`;
    a.innerHTML = `<div class="title">${meta.title}</div><div class="author">${meta.author}</div>`;
    booksEl.appendChild(a);
  });
}
main();
</script>
</body>
</html>
