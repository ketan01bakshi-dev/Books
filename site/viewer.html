<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Book Mind Map</title>
<link rel="stylesheet" href="assets/mindmap.css" />
</head>
<body>
<header>
  <a class="back" href="index.html">← Library</a>
  <h1 id="title">Loading…</h1>
  <span class="meta" id="meta"></span>
  <input id="search" type="text" placeholder="Search, then press Enter…" />
  <span class="hint">Click a node to expand/collapse · drag to pan · scroll to zoom</span>
</header>
<div id="viewport">
  <div id="stage">
    <svg id="edges"></svg>
    <div id="nodesLayer"></div>
  </div>
</div>
<div id="controls">
  <button id="zoomOut" title="Zoom out">−</button>
  <button id="zoomReset" title="Reset view">⤾</button>
  <button id="zoomIn" title="Zoom in">+</button>
</div>
<div id="detail"></div>
<script src="assets/mindmap.js"></script>
</body>
</html>
