<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Man's Search for Meaning</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Archivo:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef1f0;
    --bg-dot:#dfe4e2;
    --panel:#ffffff;
    --panel-border:#d3d9d6;
    --ink:#1b2320;
    --ink-dim:#5b6660;
    --hub-bg:#fbfaf7;
    --hub-border:#2a3430;
    --note-bg:#ffffffcc;
    --shadow:0 2px 10px rgba(20,30,26,0.10);
    --accent:#2f7fa0;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#11161a;
      --bg-dot:#1a2126;
      --panel:#181f24;
      --panel-border:#2b3339;
      --ink:#e8ece9;
      --ink-dim:#9aa6a0;
      --hub-bg:#161d21;
      --hub-border:#c7d1cb;
      --note-bg:#1c242a;
      --shadow:0 4px 18px rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#11161a;
    --bg-dot:#1a2126;
    --panel:#181f24;
    --panel-border:#2b3339;
    --ink:#e8ece9;
    --ink-dim:#9aa6a0;
    --hub-bg:#161d21;
    --hub-border:#c7d1cb;
    --note-bg:#1c242a;
    --shadow:0 4px 18px rgba(0,0,0,0.45);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Archivo',system-ui,sans-serif;
    height:100dvh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  header{
    flex:none;
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
    padding:12px 16px;
    padding-top:calc(12px + env(safe-area-inset-top,0px));
    border-bottom:1px solid var(--panel-border);
    background:var(--panel);
    z-index:5;
  }
  header h1{
    font-family:'Newsreader',serif;
    font-weight:500;
    font-size:19px;
    margin:0;
    white-space:nowrap;
  }
  header .byline{
    font-size:12px;
    color:var(--ink-dim);
    font-style:italic;
    white-space:nowrap;
    margin-right:auto;
  }
  header .hint{
    font-size:11.5px;
    color:var(--ink-dim);
    display:none;
  }
  @media (min-width:820px){ header .hint{ display:block; } }

  .controls{
    display:flex;
    align-items:center;
    gap:8px;
  }
  select, button{
    font-family:'Archivo',sans-serif;
    font-size:12.5px;
    font-weight:600;
    border-radius:8px;
    border:1px solid var(--panel-border);
    background:var(--bg);
    color:var(--ink);
    padding:7px 10px;
    cursor:pointer;
  }
  button:hover, select:hover{ border-color:var(--accent); }
  button.icon{ width:32px; padding:7px 0; text-align:center; }

  #viewport{
    position:relative;
    flex:1;
    overflow:hidden;
    background-image:radial-gradient(var(--bg-dot) 1.2px, transparent 1.2px);
    background-size:26px 26px;
    cursor:grab;
    touch-action:none;
  }
  #viewport.grabbing{ cursor:grabbing; }

  #stage{
    position:absolute;
    top:0; left:0;
    transform-origin:0 0;
    visibility:hidden;
  }
  #stage.ready{ visibility:visible; }
  #stage.animating{ transition:transform .55s cubic-bezier(.2,.7,.2,1); }

  svg#edges{ position:absolute; top:0; left:0; overflow:visible; }

  #nodesLayer{ position:absolute; top:0; left:0; }

  .item{
    position:absolute;
    transform:translate(-50%,-50%);
  }

  .pill{
    border-radius:12px;
    padding:11px 16px;
    font-weight:600;
    font-size:14px;
    line-height:1.3;
    box-shadow:var(--shadow);
    user-select:none;
    text-align:center;
    max-width:220px;
  }
  .pill.linked::before{
    content:"";
    position:absolute;
    top:50%; left:-9px;
    width:9px; height:9px;
    border-radius:50%;
    border:2px solid var(--pill-c, #888);
    background:var(--panel);
    transform:translateY(-50%);
  }
  .pill.collapsed, .pill.expanded{
    cursor:pointer;
    padding-right:26px;
  }
  .pill.collapsed::after, .pill.expanded::after{
    position:absolute;
    top:7px; right:9px;
    font-size:12px;
    line-height:1;
    opacity:.85;
  }
  .pill.collapsed::after{ content:"+"; }
  .pill.expanded::after{ content:"\2013"; }

  .hub{
    background:var(--hub-bg);
    border:2.5px dashed var(--hub-border);
    border-radius:20px;
    padding:20px 26px;
    text-align:center;
    box-shadow:var(--shadow);
    cursor:pointer;
    max-width:250px;
  }
  .hub .t1{ font-family:'Newsreader',serif; font-weight:600; font-size:19px; line-height:1.25; }
  .hub .t2{ font-family:'Newsreader',serif; font-style:italic; font-size:13px; color:var(--ink-dim); margin-top:8px; }

  .note{
    background:var(--note-bg);
    border-left:3px solid var(--note-c, var(--accent));
    border-radius:4px 10px 10px 4px;
    padding:9px 13px;
    box-shadow:var(--shadow);
    max-width:300px;
    cursor:default;
  }
  .note p{
    margin:0;
    font-family:'Newsreader',serif;
    font-size:13.5px;
    line-height:1.5;
    color:var(--ink);
  }
  .note p + p{ margin-top:7px; }
  .note.wide{ max-width:380px; }

  .tag{
    position:absolute;
    transform:translate(-50%,-50%);
    font-size:12px;
    font-weight:600;
    color:var(--ink-dim);
    padding:5px 10px;
    border:1px solid var(--panel-border);
    border-radius:8px;
    background:var(--panel);
    white-space:nowrap;
  }

  #legend{
    position:absolute;
    bottom:14px;
    left:14px;
    right:14px;
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    pointer-events:none;
    font-size:10.5px;
  }
  #legend span{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:999px;
    padding:3px 9px;
    color:var(--ink-dim);
  }
</style>
</head>
<body>
<header>
  <h1>Man's Search for Meaning</h1>
  <span class="byline">Viktor E. Frankl — a concept map</span>
  <span class="hint">Drag to pan · scroll to zoom · click any topic to follow it</span>
  <div class="controls">
    <select id="jump">
      <option value="">Jump to a theme…</option>
    </select>
    <button class="icon" id="zoomOut" title="Zoom out">−</button>
    <button class="icon" id="zoomIn" title="Zoom in">+</button>
    <button id="reset" title="Back to overview">Overview</button>
  </div>
</header>
<div id="viewport">
  <div id="stage">
    <svg id="edges"></svg>
    <div id="nodesLayer"></div>
  </div>
  <div id="legend"></div>
</div>

<script>
(function(){
  "use strict";

  // ---------- palette ----------
  var COLOR = {
    decisions:   "#24344d",
    psychosomatic:"#4f7f96",
    fear:        "#7fb8b5",
    meaning:     "#2f7fa0",
    success:     "#3f5b70",
    humour:      "#1c2430",
    coldCuriosity:"#b5573c",
    psychology:  "#d98a6a",
    happiness:   "#e8935f",
    response:    "#e8b6a4",
    suffering:   "#e8b6a4",
    spirituality:"#b23a2c",
    tragic:      "#2f7d6e",
    love:        "#a8456b"
  };
  var ARROW = {
    green:"#3f9142", rust:"#c0392b", rose:"#a8456b", teal:"#2f7d6e", amber:"#b8860b"
  };

  // ---------- data model ----------
  function T(id,label,color,children,opts){
    var o = {id:id, kind:"topic", label:label, color:color, children:children||[]};
    if(opts) for(var k in opts) o[k]=opts[k];
    return o;
  }
  function N(id,color,paragraphs,children,opts){
    var o = {id:id, kind:"note", color:color, paragraphs:paragraphs, children:children||[]};
    if(opts) for(var k in opts) o[k]=opts[k];
    return o;
  }

  var TREE = T("root","Man's Search For Meaning\nViktor E. Frankl", "#2a3430", [

    T("decisions","Decisions", COLOR.decisions, [
      N("decisions-attitude", COLOR.decisions, [
        "Everything can be taken from a person but one thing: the last of the human freedoms — to choose one's own attitude in any given set of circumstances, to choose one's own way."
      ]),
      N("decisions-nietzsche", COLOR.decisions, [
        "“He who has a why to live for can bear with almost any how.” — Nietzsche, a line Frankl returns to again and again."
      ])
    ]),

    T("psychosomatic","Psychosomatic", COLOR.psychosomatic, [
      N("psycho-1", COLOR.psychosomatic, [
        "There is a close connection between the state of mind of a man — his courage and hope, or lack of them — and the state of immunity of his body."
      ]),
      N("psycho-2", COLOR.psychosomatic, [
        "The body has fewer inhibitions than the mind."
      ])
    ]),

    T("fear","Fear", COLOR.fear, [
      N("fear-1", COLOR.fear, [
        "Fear of a fate can help bring that fate about. An anxious anticipation of what is dreaded tends to make the dreaded thing more likely — the seed of what logotherapy later named anticipatory anxiety."
      ])
    ]),

    T("meaning","Meaning / Purpose", COLOR.meaning, [
      T("will-to-meaning","Will to Meaning", COLOR.meaning, [
        N("will-to-meaning-q", COLOR.meaning, [
          "Man's search for meaning is the primary motivation in his life — not a “secondary rationalization” of instinctual drives, as Freud's will to pleasure or Adler's will to power would have the true engine be."
        ])
      ]),
      T("three-roads","Three Roads to Meaning", COLOR.meaning, [
        T("road-work","By a work or a deed", COLOR.meaning, []),
        T("road-love","By experiencing something, or someone", COLOR.meaning, [], {linkable:true}),
        T("road-suffering","By the attitude taken toward unavoidable suffering", COLOR.meaning, [])
      ]),
      T("existential-vacuum","Existential Vacuum", COLOR.meaning, [
        N("existential-vacuum-q", COLOR.meaning, [
          "A widespread feeling of inner emptiness, most often surfacing once the rush of the working week falls away — Frankl names its weekend form “Sunday neurosis.”"
        ])
      ]),
      T("self-transcendence","Self-Transcendence", COLOR.meaning, [
        N("self-transcendence-q", COLOR.meaning, [
          "Being human always points beyond itself, toward something or someone other than oneself. Self-actualization is only ever a side-effect of that reaching outward, never a target in itself."
        ])
      ]),
      // floating association cluster (kept near Meaning for layout, drawn with no solid line)
      T("happiness","Happiness", COLOR.happiness, [], {noEdge:true, linkable:true}),
      T("response","Response", COLOR.response, [], {noEdge:true, linkable:true}),
      T("suffering","Suffering", COLOR.suffering, [], {noEdge:true, linkable:true}),
      T("spirituality","Spirituality", COLOR.spirituality, [], {noEdge:true, linkable:true})
    ]),

    T("success","Success", COLOR.success, [
      N("success-1", COLOR.success, [
        "Don't aim at success — the more you make it a target, the more you are going to miss it.",
        "You have to let it happen by not caring about it. Success, like happiness, cannot be pursued; it must ensue, and it only does so as the unintended side-effect of one's dedication to a cause greater than oneself, or as the by-product of one's surrender to a person other than oneself."
      ], null, {width:340}),
      N("success-2", COLOR.success, [
        "Listen to what your conscience commands you to do, and go on to carry it out to the best of your knowledge.",
        "Then you will live to see that, in the long run — in the long run, mind you — success will follow you, precisely because you had forgotten to think of it."
      ], null, {width:340})
    ]),

    T("humour","Humour", COLOR.humour, [
      N("humour-1", COLOR.humour, [
        "Humour was another of the soul's weapons in the fight for self-preservation.",
        "Humour, more than almost anything else in the human make-up, can afford an aloofness and an ability to rise above any situation, even if only for a few seconds."
      ])
    ], {linkable:true}),

    T("coldCuriosity","Cold Curiosity", COLOR.coldCuriosity, [
      N("cold-1", COLOR.coldCuriosity, [
        "As a fundamental reaction to certain strange circumstances, one's mind became somehow detached from its surroundings, which came to be regarded with a kind of objectivity.",
        "At that time one cultivated this state of mind as a means of protection."
      ]),
      N("cold-2", COLOR.coldCuriosity, [
        "We were anxious to know what would happen next, and what the consequence would eventually be."
      ])
    ], {linkable:true}),

    T("psychology","Psychology", COLOR.psychology, [
      T("stages","Stages of a Prisoner's Psychological Reaction", COLOR.psychology, [
        T("stage1","Stage 1 — Shock", COLOR.psychology, [
          N("phase1", COLOR.psychology, [
            "Phase 1 — Delusion of reprieve: the condemned man, immediately before his execution, gets the illusion that he may be reprieved at the last minute."
          ]),
          T("phase2","Phase 2 — Overcome by a grim sense of humour, for a few seconds or minutes", COLOR.psychology, []),
          T("phase3","Phase 3 — Cold curiosity", COLOR.psychology, []),
          T("phase4","Phase 4 — Surprise", COLOR.psychology, []),
          T("hopelessness","Hopelessness", COLOR.psychology, [])
        ]),
        T("stage2","Stage 2 — Relative Apathy", COLOR.psychology, [
          N("stage2-q", COLOR.psychology, [
            "Apathy — the blunting of the emotions and the feeling that one could not care any more — was a necessary mechanism of self-defence, a kind of emotional death.",
            "By means of this insensibility the prisoner surrounded himself with a very necessary protective shell.",
            "The most painful part of a beating is not the pain itself but the insult it implies."
          ], null, {width:340})
        ]),
        T("stage3","Stage 3 — Prisoner Psychology After Liberation", COLOR.psychology, [
          T("depersonalization","Depersonalization", COLOR.psychology, [
            N("dp1", COLOR.psychology, [
              "Phase 1: everything appeared unreal, unlikely, as in a dream. The capacity to feel pleasure had simply gone, and had to be relearned, slowly."
            ]),
            N("dp2", COLOR.psychology, [
              "Phase 2: a moral deformity, brought on by the sudden release of mental pressure — bitterness and disillusionment, once the liberated man's expectations met an indifferent world."
            ])
          ])
        ])
      ]),
      T("deathInTeheran","Death in Teheran", COLOR.psychology, [
        N("death-q", COLOR.psychology, [
          "A rich and mighty Persian once walked in his garden with one of his servants. The servant cried that he had just encountered Death, who had threatened him. He begged his master for his fastest horse, so that he might ride to Teheran and reach it that same evening. The master consented, and the servant rode off.",
          "On returning to his house, the master himself came upon Death, and asked him why he had threatened his servant. “I did not threaten him,” Death replied. “I only showed surprise in still finding him here, when I had planned to meet him tonight — in Teheran.”"
        ], null, {width:380})
      ]),
      T("bismarck","Words of Bismarck", COLOR.psychology, [
        N("bismarck-q", COLOR.psychology, [
          "Life is like being at the dentist. You always think that the worst is still to come, and yet it is over already."
        ])
      ]),
      T("spinoza","Spinoza, in his Ethics", COLOR.psychology, [
        N("spinoza-q", COLOR.psychology, [
          "Emotion, which is suffering, ceases to be suffering as soon as we form a clear and precise picture of it."
        ])
      ]),
      T("rilke","Rilke", COLOR.psychology, [
        N("rilke-q", COLOR.psychology, [
          "How much suffering there is to get through.",
          "He spoke of suffering the way others speak of getting through work."
        ])
      ]),
      N("experienced-q", COLOR.psychology, [
        "What you have experienced, no power on earth can take from you."
      ]),
      T("principles","Principles", COLOR.psychology, [
        T("nothingbutness","Nothingbutness", COLOR.psychology, [
          N("nb-q", COLOR.psychology, [
            "The theory that man is nothing but the result of biological, psychological, and sociological conditions — the product of heredity and environment. This theory denies that man is free."
          ])
        ]),
        T("panDeterminism","Pan-determinism", COLOR.psychology, [
          N("pd-q", COLOR.psychology, [
            "The view of man that disregards his capacity to take a stand toward any conditions whatsoever.",
            "Frankl's own view: man is not fully conditioned and determined, but rather determines himself — whether he gives in to conditions, or stands up to them."
          ])
        ], {linkable:true}),
        N("freedom-resp", COLOR.psychology, [
          "Freedom is only the negative aspect of the whole phenomenon, whose positive aspect is responsibleness."
        ]),
        N("innermost-core", COLOR.psychology, [
          "The innermost core of a patient's personality is not even touched by a psychosis."
        ])
      ])
    ]),

    T("tragic","Tragic Optimism", COLOR.tragic, [
      T("triad","The Tragic Triad", COLOR.tragic, [
        N("triad-q", COLOR.tragic, [
          "Pain, guilt, and death — the three facts of existence that optimism cannot pretend away.",
          "Tragic optimism means staying capable of turning suffering into achievement, guilt into a chance to change for the better, and life's transience into a spur toward responsible action."
        ], null, {width:340})
      ], {linkable:true}),
      N("second-time", COLOR.tragic, [
        "Live as if you were living already for the second time, and as if you had acted the first time as wrongly as you are about to act now!"
      ]),
      N("defiant-spirit", COLOR.tragic, [
        "Even in the most extreme circumstances, a person keeps what Frankl calls the defiant power of the human spirit — the capacity to rise above outward fate."
      ])
    ]),

    T("love","Love", COLOR.love, [
      N("love-goal", COLOR.love, [
        "Love is the ultimate and the highest goal to which man can aspire.",
        "The salvation of man is through love and in love."
      ], null, {linkable:true}),
      N("tilly", COLOR.love, [
        "Marching through the icy dark toward the work site, Frankl held a mental image of his wife's face — proof to himself that love reaches its deepest meaning even when it is left with nothing to hold on to but the beloved's inner presence."
      ])
    ])
  ]);

  var LINKS = [
    {from:"meaning", to:"happiness", color:ARROW.green},
    {from:"meaning", to:"spirituality", color:ARROW.green},
    {from:"spirituality", to:"happiness", color:ARROW.green},
    {from:"spirituality", to:"response", color:ARROW.green},
    {from:"suffering", to:"response", color:ARROW.green},
    {from:"stages", to:"humour", color:ARROW.rust},
    {from:"stages", to:"coldCuriosity", color:ARROW.rust},
    {from:"love-goal", to:"road-love", color:ARROW.rose},
    {from:"triad", to:"suffering", color:ARROW.teal},
    {from:"decisions", to:"panDeterminism", color:ARROW.amber}
  ];

  // ---------- one-time indexing over the FULL tree (independent of expand state) ----------
  var viewport = document.getElementById("viewport");
  var stage = document.getElementById("stage");
  var svg = document.getElementById("edges");
  var nodesLayer = document.getElementById("nodesLayer");
  var jumpSelect = document.getElementById("jump");
  var legend = document.getElementById("legend");
  var svgNS = "http://www.w3.org/2000/svg";

  var byId = {};
  function indexAll(node){
    byId[node.id] = node;
    node.children.forEach(indexAll);
  }
  indexAll(TREE);
  TREE.expanded = true;

  function luminance(hex){
    hex = hex.replace("#","");
    var r = parseInt(hex.substr(0,2),16)/255;
    var g = parseInt(hex.substr(2,2),16)/255;
    var b = parseInt(hex.substr(4,2),16)/255;
    return 0.299*r + 0.587*g + 0.114*b;
  }

  var linkedIds = {};
  LINKS.forEach(function(l){ linkedIds[l.from]=true; linkedIds[l.to]=true; });

  // ---------- jump menu + legend (built once, from the full tree's top-level branches) ----------
  TREE.children.forEach(function(top){
    var opt = document.createElement("option");
    opt.value = top.id;
    opt.textContent = top.label;
    jumpSelect.appendChild(opt);

    var tag = document.createElement("span");
    tag.textContent = top.label;
    tag.style.borderColor = top.color;
    legend.appendChild(tag);
  });

  function createEl(node){
    var el = document.createElement("div");
    el.className = "item";
    el.dataset.id = node.id;
    if(node.id === "root"){
      el.classList.add("hub");
      var lines = node.label.split("\n");
      el.innerHTML = '<div class="t1">'+lines[0]+'</div><div class="t2">'+lines[1]+'</div>';
    } else if(node.kind === "topic"){
      el.classList.add("pill");
      el.style.background = node.color;
      el.style.color = luminance(node.color) > 0.5 ? "#1b2320" : "#fdfdfc";
      el.style.setProperty("--pill-c", node.color);
      el.textContent = node.label;
      if(node.children.length){
        el.classList.add(node.expanded ? "expanded" : "collapsed");
      }
      if(node.linkable || linkedIds[node.id]) el.classList.add("linked");
    } else {
      el.classList.add("note");
      if(node.width){ el.classList.add("wide"); el.style.maxWidth = node.width + "px"; }
      el.style.setProperty("--note-c", node.color);
      node.paragraphs.forEach(function(p){
        var pEl = document.createElement("p");
        pEl.textContent = p;
        el.appendChild(pEl);
      });
    }
    node.el = el;
    nodesLayer.appendChild(el);
  }

  function setExpandedDeep(node, val){
    node.expanded = val;
    node.children.forEach(function(c){ setExpandedDeep(c, val); });
  }

  function onPillClick(node){
    setExpandedDeep(node, !node.expanded);
    rebuild();
    if(node.expanded) focusOn(node); else overview();
  }

  // ---------- radial placement of the top-level branches ----------
  // Each branch is a spoke at a fixed angle: it and its whole (possibly deep)
  // subtree are laid out exactly like the old left-to-right tree, then that
  // whole rigid strip is rotated to point outward at the branch's angle.
  // Rotation preserves distances, so a branch that doesn't overlap itself
  // never will; branches only need enough angular room not to collide with
  // their neighbours, which is sized from each branch's WORST-CASE (fully
  // expanded) width so the map never overlaps even fully exploded.
  var COL_GAP = 90, ROW_GAP = 16, MARGIN = 90, BRANCH_GAP = 34;

  (function measureEverything(){
    // temporarily render the whole tree (hidden via #stage{visibility:hidden})
    // purely to get every node's real rendered size, once. Sizes never
    // change after this (collapsed/expanded pills reserve the same width),
    // so nothing needs re-measuring on later rebuilds.
    (function createAll(node){
      createEl(node);
      node.children.forEach(createAll);
    })(TREE);
    (function measure(node){
      node.w = node.el.offsetWidth;
      node.h = node.el.offsetHeight;
      node.children.forEach(measure);
    })(TREE);
    nodesLayer.innerHTML = "";
  })();

  // Branches sit at fixed, evenly-spaced angles (a clean symmetric wheel by
  // default) starting at the top, going clockwise.
  var startAngle = -Math.PI/2;
  TREE.children.forEach(function(b, i){
    b.angle = startAngle + i * (2*Math.PI / TREE.children.length);
  });
  var hubDiag = Math.sqrt(TREE.w*TREE.w + TREE.h*TREE.h) / 2;

  // ---------- layout + render (re-run whenever the expanded set changes) ----------
  var visible = [];

  // A node's box stays upright on screen — only its center moves along the
  // rotated branch — so a gap that's safe for a rightward-pointing branch
  // isn't automatically safe for a diagonal one (the same physical gap
  // projects to less clearance on each screen axis once it's not axis
  // aligned). The rotation-proof fix: size every gap, in every direction,
  // off each node's full diagonal rather than its width or height. Distance
  // between centers >= sum of half-diagonals can never overlap, whatever
  // angle the branch sits at.
  function halfDiag(n){ return Math.sqrt(n.w*n.w + n.h*n.h) / 2; }

  function layoutBranch(branch){
    var nodes = [];
    var maxLocalDepth = 0;
    (function dfs(node, depth, parent){
      node.localDepth = depth;
      node.parent = parent;
      node.branchAngle = branch.angle;
      if(depth > maxLocalDepth) maxLocalDepth = depth;
      nodes.push(node);
      var kids = node.expanded ? node.children : [];
      kids.forEach(function(c){ dfs(c, depth+1, node); });
    })(branch, 0, TREE);

    var maxHalfDiag = [];
    nodes.forEach(function(n){ maxHalfDiag[n.localDepth] = Math.max(maxHalfDiag[n.localDepth]||0, halfDiag(n)); });
    var colXLocal = [0];
    for(var d=1; d<=maxLocalDepth; d++){ colXLocal[d] = colXLocal[d-1] + maxHalfDiag[d-1] + maxHalfDiag[d] + COL_GAP; }

    function place(node, top){
      var kids = node.expanded ? node.children : [];
      if(!kids.length){ var hd = halfDiag(node); node.tang = top + hd; return hd*2; }
      var cursor = top;
      kids.forEach(function(c, i){
        var h = place(c, cursor);
        cursor += h + (i < kids.length-1 ? ROW_GAP : 0);
      });
      var span = cursor - top;
      node.tang = top + span/2;
      return Math.max(halfDiag(node)*2, span);
    }
    var curSpan = place(branch, 0);

    var branchTang = branch.tang;
    nodes.forEach(function(n){
      n.radiusOffset = colXLocal[n.localDepth];
      n.t = n.tang - branchTang;
    });
    return { nodes: nodes, curSpan: curSpan };
  }

  function toGlobal(angle, r, t, shiftX, shiftY){
    return {
      x: shiftX + r*Math.cos(angle) - t*Math.sin(angle),
      y: shiftY + r*Math.sin(angle) + t*Math.cos(angle)
    };
  }

  function rebuild(){
    var branches = TREE.children.map(function(b){ return { branch: b, res: layoutBranch(b) }; });
    var n = branches.length;

    // Radius grows only as far as whatever is CURRENTLY expanded actually
    // needs: two neighbouring branches at fixed angular separation dTheta
    // can't collide, at any radius r, once 2*r*sin(dTheta/2) covers their
    // combined current widths — so the map stays compact by default and
    // only expands outward around whatever the user just opened.
    var maxPillHalf = 0;
    branches.forEach(function(bb){ maxPillHalf = Math.max(maxPillHalf, Math.sqrt(bb.branch.w*bb.branch.w+bb.branch.h*bb.branch.h)/2); });
    var R0 = hubDiag + maxPillHalf + BRANCH_GAP;
    for(var i=0; i<n; i++){
      var a = branches[i], b = branches[(i+1)%n];
      var dTheta = (i === n-1) ? (a.branch.angle + 2*Math.PI - branches[0].branch.angle) : (b.branch.angle - a.branch.angle);
      var need = ((a.res.curSpan + b.res.curSpan)/2 + BRANCH_GAP) / (2*Math.sin(dTheta/2));
      R0 = Math.max(R0, need);
    }

    visible = [TREE];
    TREE.r = 0; TREE.t = 0; TREE.branchAngle = 0;
    branches.forEach(function(bb){
      bb.res.nodes.forEach(function(nd){ nd.r = R0 + nd.radiusOffset; });
      visible = visible.concat(bb.res.nodes);
    });

    // raw (unshifted) positions, to find the bounding box
    visible.forEach(function(n){
      var p = toGlobal(n.branchAngle, n.r, n.t, 0, 0);
      n.gx = p.x; n.gy = p.y;
    });
    var minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
    visible.forEach(function(n){
      minX = Math.min(minX, n.gx-n.w/2); maxX = Math.max(maxX, n.gx+n.w/2);
      minY = Math.min(minY, n.gy-n.h/2); maxY = Math.max(maxY, n.gy+n.h/2);
    });
    var shiftX = MARGIN - minX, shiftY = MARGIN - minY;
    visible.forEach(function(n){ n.x = n.gx + shiftX; n.y = n.gy + shiftY; });

    var CANVAS_W = (maxX-minX) + MARGIN*2;
    var CANVAS_H = (maxY-minY) + MARGIN*2;
    stage.style.width = CANVAS_W + "px";
    stage.style.height = CANVAS_H + "px";
    svg.setAttribute("width", CANVAS_W);
    svg.setAttribute("height", CANVAS_H);
    svg.setAttribute("viewBox", "0 0 "+CANVAS_W+" "+CANVAS_H);
    nodesLayer.style.width = CANVAS_W + "px";
    nodesLayer.style.height = CANVAS_H + "px";

    nodesLayer.innerHTML = "";
    svg.innerHTML = "";
    visible.forEach(createEl);
    visible.forEach(function(node){
      node.el.style.left = node.x + "px";
      node.el.style.top = node.y + "px";
    });

    // solid parent -> child curves, bowed along each branch's own outward
    // direction, then rotated with it
    visible.forEach(function(node){
      if(!node.parent || node.noEdge) return;
      var p = node.parent;
      var dr = (node.r - p.r) * 0.55;
      var localPts = [
        {r:p.r,      t:p.t},
        {r:p.r+dr,   t:p.t},
        {r:node.r-dr,t:node.t},
        {r:node.r,   t:node.t}
      ];
      var g = localPts.map(function(pt){ return toGlobal(node.branchAngle, pt.r, pt.t, shiftX, shiftY); });
      var path = document.createElementNS(svgNS, "path");
      path.setAttribute("d", "M "+g[0].x+" "+g[0].y+" C "+g[1].x+" "+g[1].y+", "+g[2].x+" "+g[2].y+", "+g[3].x+" "+g[3].y);
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", node.color);
      path.setAttribute("stroke-width", "2");
      path.setAttribute("opacity", "0.55");
      svg.appendChild(path);
    });

    // dashed association arrows, only when both ends are currently visible
    var visibleSet = {};
    visible.forEach(function(n){ visibleSet[n.id] = true; });
    var defs = document.createElementNS(svgNS, "defs");
    svg.appendChild(defs);
    var usedColors = {};
    LINKS.forEach(function(l){ if(visibleSet[l.from] && visibleSet[l.to]) usedColors[l.color] = true; });
    Object.keys(usedColors).forEach(function(color){
      var marker = document.createElementNS(svgNS,"marker");
      marker.setAttribute("id", "arrow-"+color.replace("#",""));
      marker.setAttribute("markerWidth","8");
      marker.setAttribute("markerHeight","8");
      marker.setAttribute("refX","6");
      marker.setAttribute("refY","4");
      marker.setAttribute("orient","auto");
      var poly = document.createElementNS(svgNS,"polygon");
      poly.setAttribute("points","0,0 8,4 0,8");
      poly.setAttribute("fill", color);
      marker.appendChild(poly);
      defs.appendChild(marker);
    });
    LINKS.forEach(function(l){
      if(!visibleSet[l.from] || !visibleSet[l.to]) return;
      var a = byId[l.from], b = byId[l.to];
      var x1=a.x, y1=a.y, x2=b.x, y2=b.y;
      var mx=(x1+x2)/2, my=(y1+y2)/2;
      var dx=x2-x1, dy=y2-y1;
      var len = Math.sqrt(dx*dx+dy*dy) || 1;
      var nx=-dy/len, ny=dx/len;
      var bow = Math.min(70, len*0.28);
      var cx=mx+nx*bow, cy=my+ny*bow;
      var path = document.createElementNS(svgNS,"path");
      path.setAttribute("d","M "+x1+" "+y1+" Q "+cx+" "+cy+" "+x2+" "+y2);
      path.setAttribute("fill","none");
      path.setAttribute("stroke", l.color);
      path.setAttribute("stroke-width","1.8");
      path.setAttribute("stroke-dasharray","1 6");
      path.setAttribute("stroke-linecap","round");
      path.setAttribute("marker-end","url(#arrow-"+l.color.replace("#","")+")");
      path.setAttribute("opacity","0.8");
      svg.appendChild(path);
    });
  }

  // ---------- pan / zoom ----------
  var scale = 0.5, panX = 0, panY = 0;
  var vw, vh;

  function apply(animate){
    stage.classList.toggle("animating", !!animate);
    stage.style.transform = "translate("+panX+"px,"+panY+"px) scale("+scale+")";
  }

  function clampScale(s){ return Math.max(0.18, Math.min(1.6, s)); }

  function measureViewport(){
    var r = viewport.getBoundingClientRect();
    vw = r.width; vh = r.height;
  }

  function fitBounds(minX,minY,maxX,maxY, animate){
    measureViewport();
    var pad = 60;
    var w = Math.max(1, maxX-minX), h = Math.max(1, maxY-minY);
    var s = clampScale(Math.min((vw-pad*2)/w, (vh-pad*2)/h));
    var cx = (minX+maxX)/2, cy = (minY+maxY)/2;
    scale = s;
    panX = vw/2 - cx*s;
    panY = vh/2 - cy*s;
    apply(animate);
  }

  function subtreeBounds(node){
    var minX=node.x-node.w/2, maxX=node.x+node.w/2, minY=node.y-node.h/2, maxY=node.y+node.h/2;
    (function rec(n){
      minX = Math.min(minX, n.x-n.w/2); maxX = Math.max(maxX, n.x+n.w/2);
      minY = Math.min(minY, n.y-n.h/2); maxY = Math.max(maxY, n.y+n.h/2);
      var kids = (n === TREE || n.expanded) ? n.children : [];
      kids.forEach(rec);
    })(node);
    return [minX,minY,maxX,maxY];
  }

  function focusOn(node){
    var b = subtreeBounds(node);
    fitBounds(b[0],b[1],b[2],b[3], true);
  }

  function overview(){
    var b = subtreeBounds(TREE);
    fitBounds(b[0],b[1],b[2],b[3], true);
  }

  // drag, with a movement threshold so a tap-in-place still acts as a click
  // (needed because setPointerCapture on the viewport can swallow the
  // browser's own synthesized click event on the pill underneath).
  var dragging=false, moved=false, startX=0, startY=0, startPanX=0, startPanY=0, downTarget=null;
  var TAP_SLOP = 5;
  viewport.addEventListener("pointerdown", function(e){
    dragging=true;
    moved=false;
    downTarget=e.target;
    viewport.classList.add("grabbing");
    stage.classList.remove("animating");
    startX=e.clientX; startY=e.clientY; startPanX=panX; startPanY=panY;
    viewport.setPointerCapture(e.pointerId);
  });
  viewport.addEventListener("pointermove", function(e){
    if(!dragging) return;
    if(!moved && (Math.abs(e.clientX-startX) > TAP_SLOP || Math.abs(e.clientY-startY) > TAP_SLOP)) moved = true;
    panX = startPanX + (e.clientX-startX);
    panY = startPanY + (e.clientY-startY);
    apply(false);
  });
  function endDrag(e){
    dragging=false;
    viewport.classList.remove("grabbing");
    if(!moved && downTarget){
      var hub = downTarget.closest(".hub");
      var pill = downTarget.closest(".pill");
      if(hub){
        TREE.children.forEach(function(c){ setExpandedDeep(c, false); });
        rebuild();
        overview();
      } else if(pill){
        var node = byId[pill.dataset.id];
        if(node && node.children.length) onPillClick(node);
      }
    }
    downTarget = null;
  }
  viewport.addEventListener("pointerup", endDrag);
  viewport.addEventListener("pointercancel", function(){ dragging=false; moved=false; downTarget=null; viewport.classList.remove("grabbing"); });

  viewport.addEventListener("wheel", function(e){
    e.preventDefault();
    stage.classList.remove("animating");
    var r = viewport.getBoundingClientRect();
    var mx = e.clientX - r.left, my = e.clientY - r.top;
    var factor = e.deltaY < 0 ? 1.12 : 0.89;
    var ns = clampScale(scale*factor);
    panX = mx - (mx-panX) * (ns/scale);
    panY = my - (my-panY) * (ns/scale);
    scale = ns;
    apply(false);
  }, {passive:false});

  document.getElementById("zoomIn").addEventListener("click", function(){
    measureViewport();
    var ns = clampScale(scale*1.2);
    panX = vw/2 - (vw/2-panX)*(ns/scale);
    panY = vh/2 - (vh/2-panY)*(ns/scale);
    scale = ns; apply(true);
  });
  document.getElementById("zoomOut").addEventListener("click", function(){
    measureViewport();
    var ns = clampScale(scale*0.83);
    panX = vw/2 - (vw/2-panX)*(ns/scale);
    panY = vh/2 - (vh/2-panY)*(ns/scale);
    scale = ns; apply(true);
  });
  document.getElementById("reset").addEventListener("click", function(){
    TREE.children.forEach(function(c){ setExpandedDeep(c, false); });
    rebuild();
    overview();
  });
  jumpSelect.addEventListener("change", function(){
    var id = jumpSelect.value;
    if(id && byId[id]){
      setExpandedDeep(byId[id], true);
      rebuild();
      focusOn(byId[id]);
    }
    jumpSelect.value = "";
  });

  window.addEventListener("resize", function(){ overview(); });

  rebuild();
  requestAnimationFrame(function(){
    stage.classList.add("ready");
    overview();
  });
})();
</script>
</body>
</html>
